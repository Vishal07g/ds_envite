<svg width="800" height="1200" viewBox="0 0 800 1200" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Realistic 3D Antique Gold Metallic Gradient -->
    <linearGradient id="royalRealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C631B"/>
      <stop offset="18%" stop-color="#D4AF37"/>
      <stop offset="35%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#E5BE4A"/>
      <stop offset="68%" stop-color="#B88A28"/>
      <stop offset="82%" stop-color="#FFF5CE"/>
      <stop offset="100%" stop-color="#7A5210"/>
    </linearGradient>

    <!-- Bevel Specular Light & Shadow Gradients -->
    <linearGradient id="royalLightBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="royalDarkBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A0F02" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#59390B" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Radial 3D Gold Bead / Pearl Shading -->
    <radialGradient id="royalGoldBead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFF3CD"/>
      <stop offset="55%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#8C631B"/>
      <stop offset="100%" stop-color="#3D2606"/>
    </radialGradient>

    <!-- Realistic Cast Shadow Filter -->
    <filter id="royalFrameShadow" x="-5%" y="-3%" width="110%" height="106%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadowAlpha">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadowAlpha"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════════════════
       OUTER HEAVY CHISELED GOLD MOLDING (Perimeter Rails)
       ══════════════════════════════════════════════════════════════════════════ -->
  <g filter="url(#royalFrameShadow)">
    <!-- Base Shadow Channel -->
    <rect x="14" y="14" width="772" height="1172" rx="10" stroke="#1A0F02" stroke-width="4.5" fill="none" opacity="0.5"/>

    <!-- Primary Heavy Gilded Beveled Rail -->
    <rect x="16" y="16" width="768" height="1168" rx="8" stroke="url(#royalRealGold)" stroke-width="3" fill="none"/>
    <rect x="15" y="15" width="770" height="1170" rx="9" stroke="url(#royalLightBevel)" stroke-width="1" fill="none" opacity="0.9"/>
    <rect x="18" y="18" width="764" height="1164" rx="7" stroke="url(#royalDarkBevel)" stroke-width="1.2" fill="none" opacity="0.85"/>

    <!-- Secondary Inset Gilded Filigree Rail -->
    <rect x="25" y="25" width="750" height="1150" rx="6" stroke="url(#royalRealGold)" stroke-width="1.6" fill="none"/>
    <rect x="28" y="28" width="744" height="1144" rx="5" stroke="url(#royalRealGold)" stroke-width="0.75" stroke-dasharray="6 3" fill="none" opacity="0.7"/>
    <rect x="33" y="33" width="734" height="1134" rx="4" stroke="url(#royalRealGold)" stroke-width="0.9" fill="none" opacity="0.5"/>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════════════
       SEMI-REALISTIC ROYAL BAROQUE CORNER EMBOSSING (Open Filigree, Zero Heavy Solids)
       ══════════════════════════════════════════════════════════════════════════ -->
  <g id="royalCorner" filter="url(#royalFrameShadow)">
    <!-- Outer Heavy Corner Bracket with Chiseled Relief -->
    <path d="M 12 85 L 12 12 L 85 12" stroke="#1A0F02" stroke-width="4" fill="none" opacity="0.45"/>
    <path d="M 12 85 L 12 12 L 85 12" stroke="url(#royalRealGold)" stroke-width="2.6" fill="none"/>
    <path d="M 13 83 L 13 13 L 83 13" stroke="url(#royalLightBevel)" stroke-width="0.9" fill="none"/>

    <!-- Inner Secondary Corner Bracket -->
    <path d="M 23 95 L 23 23 L 95 23" stroke="url(#royalRealGold)" stroke-width="1.6" fill="none"/>

    <!-- Delicate Sculpted Baroque Acanthus Leaf Scrolls (Open ribbons with high-gleam edges) -->
    <path d="M 24 24 Q 48 48 74 34 Q 96 22 88 48 Q 78 74 48 72 Q 34 48 24 24" 
          stroke="url(#royalRealGold)" stroke-width="1.8" fill="none"/>
    <path d="M 26 26 Q 50 50 72 36" stroke="url(#royalLightBevel)" stroke-width="1.2" fill="none"/>

    <!-- Inner Spiraling Baroque Ribbon -->
    <path d="M 28 28 Q 55 55 44 82 Q 34 104 54 98 Q 70 92 64 70 Q 58 48 86 42 Q 108 36 96 58" 
          stroke="url(#royalRealGold)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M 29 29 Q 56 56 45 83" stroke="#FFF" stroke-width="0.6" stroke-opacity="0.8" fill="none"/>

    <!-- Sculpted Corner Rosette Medallion -->
    <circle cx="28" cy="28" r="5.5" fill="url(#royalGoldBead)" stroke="#3E2606" stroke-width="0.7"/>
    <circle cx="26.5" cy="26.5" r="1.6" fill="#FFFFFF" opacity="0.9"/>

    <circle cx="54" cy="98" r="3.2" fill="url(#royalGoldBead)" stroke="#3E2606" stroke-width="0.5"/>
    <circle cx="98" cy="54" r="3.2" fill="url(#royalGoldBead)" stroke="#3E2606" stroke-width="0.5"/>
    <circle cx="120" cy="23" r="2.5" fill="url(#royalGoldBead)"/>
    <circle cx="23" cy="120" r="2.5" fill="url(#royalGoldBead)"/>
  </g>

  <!-- Replicate Corner to all 4 corners -->
  <use href="#royalCorner" transform="translate(800, 0) scale(-1, 1)" />
  <use href="#royalCorner" transform="translate(0, 1200) scale(1, -1)" />
  <use href="#royalCorner" transform="translate(800, 1200) scale(-1, -1)" />

  <!-- ══════════════════════════════════════════════════════════════════════════
       SEMI-REALISTIC TOP ROYAL CROWN CREST
       ══════════════════════════════════════════════════════════════════════════ -->
  <g transform="translate(400, 22)" filter="url(#royalFrameShadow)">
    <path d="M -70 5 C -45 -10 -22 -14 0 -4 C 22 -14 45 -10 70 5" stroke="url(#royalRealGold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M -68 4 C -44 -11 -21 -15 0 -5 C 21 -15 44 -11 68 4" stroke="url(#royalLightBevel)" stroke-width="0.8" fill="none"/>

    <path d="M -58 12 C -35 2 -18 0 0 7 C 18 0 35 2 58 12" stroke="url(#royalRealGold)" stroke-width="1.4" fill="none" stroke-linecap="round"/>

    <!-- Royal Crown Finial -->
    <polygon points="0,-18 -6,-8 0,-11 6,-8" fill="url(#royalRealGold)" stroke="#3E2606" stroke-width="0.6"/>
    <circle cx="0" cy="-4" r="5" fill="url(#royalGoldBead)" stroke="#3E2606" stroke-width="0.6"/>
    <circle cx="-1.5" cy="-5.5" r="1.5" fill="#FFFFFF" opacity="0.85"/>

    <circle cx="-28" cy="0" r="3" fill="url(#royalGoldBead)"/>
    <circle cx="28" cy="0" r="3.2" fill="url(#royalGoldBead)"/>
  </g>

  <!-- Bottom Crest -->
  <g transform="translate(400, 1178)" filter="url(#royalFrameShadow)">
    <path d="M -70 -5 C -45 10 -22 14 0 4 C 22 14 45 10 70 -5" stroke="url(#royalRealGold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M -68 -4 C -44 11 -21 15 0 5 C 21 15 44 11 68 -4" stroke="url(#royalLightBevel)" stroke-width="0.8" fill="none"/>

    <polygon points="0,18 -6,8 0,11 6,8" fill="url(#royalRealGold)" stroke="#3E2606" stroke-width="0.6"/>
    <circle cx="0" cy="4" r="5" fill="url(#royalGoldBead)" stroke="#3E2606" stroke-width="0.6"/>
    <circle cx="-1.5" cy="2.5" r="1.5" fill="#FFFFFF" opacity="0.85"/>

    <circle cx="-28" cy="0" r="3" fill="url(#royalGoldBead)"/>
    <circle cx="28" cy="0" r="3" fill="url(#royalGoldBead)"/>
  </g>
</svg>
