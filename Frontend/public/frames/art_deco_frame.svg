<svg width="800" height="1200" viewBox="0 0 800 1200" fill="none" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="decoGold" x1="0" y1="0" x2="800" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="25%" stop-color="#C59B27"/>
      <stop offset="50%" stop-color="#F5E084"/>
      <stop offset="75%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#E6CA65"/>
    </linearGradient>
  </defs>

  <!-- Triple Parallel Lines Perimeter -->
  <rect x="20" y="20" width="760" height="1160" stroke="url(#decoGold)" stroke-width="2" fill="none"/>
  <rect x="30" y="30" width="740" height="1140" stroke="url(#decoGold)" stroke-width="0.8" fill="none" opacity="0.6"/>
  <rect x="36" y="36" width="728" height="1128" stroke="url(#decoGold)" stroke-width="1.5" fill="none"/>

  <!-- Stepped Art Deco Geometric Corner -->
  <g id="decoCorner" stroke="url(#decoGold)" stroke-width="1.8" fill="none">
    <!-- Stepped brackets -->
    <path d="M 12 80 L 12 12 L 80 12" stroke-width="3"/>
    <path d="M 24 68 L 24 24 L 68 24" stroke-width="1.5"/>
    <path d="M 44 44 L 44 90 M 44 44 L 90 44" stroke-width="1.5"/>
    
    <!-- Diamond Inset -->
    <polygon points="56,36 76,56 56,76 36,56" stroke-width="1.5" fill="url(#decoGold)" fill-opacity="0.15"/>
    <circle cx="56" cy="56" r="3" fill="url(#decoGold)"/>

    <!-- Chevron accents -->
    <path d="M 16 16 L 36 36" stroke-width="1.5"/>
    <polygon points="12,12 24,12 12,24" fill="url(#decoGold)"/>
  </g>

  <!-- 4 Corners -->
  <use href="#decoCorner" />
  <use href="#decoCorner" transform="translate(800, 0) scale(-1, 1)" />
  <use href="#decoCorner" transform="translate(0, 1200) scale(1, -1)" />
  <use href="#decoCorner" transform="translate(800, 1200) scale(-1, -1)" />

  <!-- Top Center Deco Crest -->
  <g transform="translate(400, 20)" stroke="url(#decoGold)" fill="none">
    <polygon points="0,-10 20,10 0,30 -20,10" stroke-width="1.5" fill="url(#decoGold)" fill-opacity="0.2"/>
    <circle cx="0" cy="10" r="3" fill="url(#decoGold)"/>
    <path d="M -50 20 L -25 35 L 0 20 L 25 35 L 50 20" stroke-width="1.2"/>
  </g>

  <!-- Bottom Center Deco Crest -->
  <g transform="translate(400, 1180)" stroke="url(#decoGold)" fill="none">
    <polygon points="0,10 20,-10 0,-30 -20,-10" stroke-width="1.5" fill="url(#decoGold)" fill-opacity="0.2"/>
    <circle cx="0" cy="-10" r="3" fill="url(#decoGold)"/>
    <path d="M -50 -20 L -25 -35 L 0 -20 L 25 -35 L 50 -20" stroke-width="1.2"/>
  </g>
</svg>
