<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4a121d" />
      <stop offset="55%" stop-color="#2a0710" />
      <stop offset="100%" stop-color="#110205" />
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA821C" />
      <stop offset="75%" stop-color="#F5DA88" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <linearGradient id="goldH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA821C" />
      <stop offset="50%" stop-color="#FFF2C2" />
      <stop offset="100%" stop-color="#AA821C" />
    </linearGradient>

    <!-- Gold Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- 2. Subtle Vignette Overlay -->
  <rect width="1200" height="630" fill="#000000" opacity="0.15" />

  <!-- 3. Dual Ornate Golden Outer Frames -->
  <rect x="36" y="36" width="1128" height="558" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" rx="8" />
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.45" rx="4" />

  <!-- 4. Corner Filigree Brackets -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" fill="none">
    <!-- Top Left -->
    <path d="M 48 88 L 48 48 L 88 48" />
    <circle cx="56" cy="56" r="3" fill="url(#goldGrad)" />
    <!-- Top Right -->
    <path d="M 1152 88 L 1152 48 L 1112 48" />
    <circle cx="1144" cy="56" r="3" fill="url(#goldGrad)" />
    <!-- Bottom Left -->
    <path d="M 48 542 L 48 582 L 88 582" />
    <circle cx="56" cy="574" r="3" fill="url(#goldGrad)" />
    <!-- Bottom Right -->
    <path d="M 1152 542 L 1152 582 L 1112 582" />
    <circle cx="1144" cy="574" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- 5. Central Royal Monogram Crest -->
  <g transform="translate(600, 260)">
    <!-- Ambient Glow Behind Crest -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.12" filter="url(#goldGlow)" />
    
    <!-- Outer Crest Ring -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#softShadow)" />

    <!-- Dotted Inner Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.65" />

    <!-- Crown at Top of Crest -->
    <g transform="translate(0, -145)">
      <path d="M -22 10 L -26 -10 L -12 -2 L 0 -18 L 12 -2 L 26 -10 L 22 10 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
      <circle cx="-26" cy="-12" r="2.5" fill="#FFF8E0" />
      <circle cx="0" cy="-20" r="3" fill="#FFF8E0" />
      <circle cx="26" cy="-12" r="2.5" fill="#FFF8E0" />
    </g>

    <!-- Couple Monogram Initials (S & V) -->
    <text x="0" y="24" 
          font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
          font-size="94" 
          font-weight="bold" 
          fill="url(#goldH)" 
          text-anchor="middle" 
          filter="url(#softShadow)"
          letter-spacing="2">
      S &amp; V
    </text>

    <!-- Flourish beneath initials -->
    <text x="0" y="80" 
          font-family="serif" 
          font-size="20" 
          fill="url(#goldGrad)" 
          opacity="0.8" 
          text-anchor="middle">
      ❦  ❖  ❦
    </text>
  </g>

  <!-- 6. Couple Names Banner -->
  <text x="600" y="475" 
        font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" 
        font-size="34" 
        font-weight="bold" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="5"
        filter="url(#softShadow)">
    SUMAN  &amp;  VISHAL
  </text>

  <!-- 7. Subtitle: Wedding Invitation -->
  <text x="600" y="515" 
        font-family="'Montserrat', sans-serif" 
        font-size="16" 
        font-weight="600" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="6">
    ✦  W E D D I N G   I N V I T A T I O N  ✦
  </text>

  <!-- 8. Formatted Date & Provenance -->
  <text x="600" y="550" 
        font-family="'Montserrat', sans-serif" 
        font-size="13" 
        font-weight="500" 
        fill="rgba(255, 255, 255, 0.75)" 
        text-anchor="middle" 
        letter-spacing="4">
    CORDIALLY INVITED • DS ENVITE
  </text>
</svg>
